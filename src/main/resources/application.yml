spring:
  application:
    name: fieldops-service-platform
  datasource:
    url: ${FIELDOPS_DB_URL:jdbc:postgresql://localhost:5441/fieldops}
    username: ${FIELDOPS_DB_USER:fieldops}
    password: ${FIELDOPS_DB_PASSWORD:fieldops}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${FIELDOPS_PORT:8091}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
