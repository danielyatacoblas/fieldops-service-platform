services:
  postgis:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fieldops-postgis:/var/lib/postgresql/data
volumes:
  fieldops-postgis:
